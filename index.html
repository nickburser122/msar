<style>

.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}label.btn{position:relative}label.btn:focus-within{outline:2px solid var(--plum-2);outline-offset:2px}

.mc:hover{border-color:var(--line)}.mc.on{border-color:var(--plum-2);background:var(--plum-soft)}.mc svg{grid-column:2/4;width:100%!important}.mc input{accent-color:var(--plum)}

.rc{background:var(--surface-2);border-radius:18px;padding:14px;cursor:pointer;border:1px solid transparent;transition:.2s var(--e)}.rc.on,.rc:hover{border-color:var(--plum-2)}.rc h4{margin:0 0 4px;font-weight:500}

.secs{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}.secs li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--surface-2);cursor:grab}.secs li.dg{opacity:.4}
.secs input,.modal input[type=checkbox]{accent-color:var(--plum)}.subm{display:flex;flex-wrap:wrap;gap:4px;width:100%}

.pop label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;font-size:13px;cursor:pointer}.pop label:hover{background:var(--surface-2)}.pop input[type=checkbox]{accent-color:var(--plum)}
